<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #6d0f18;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#openButton {
  background: transparent;
  color: #d9b66f;
  border: 1px solid #d9b66f;
  border-radius: 40px;
  padding: 17px 60px;
  font-family: Georgia, serif;
  font-size: 21px;
  letter-spacing: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<button id="openButton" onclick="openInvitation()">OPEN</button>

<video id="music"
       loop
       playsinline
       preload="auto"
       style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;">
  <source src="Arose%20mahtab%20.mov" type="video/quicktime">
</video>

<script>
function openInvitation() {

  const music = document.getElementById("music");

  music.play().catch(function(error) {
    console.log(error);
  });

  window.open(
    "https://www.invitedrop.com/i/896d8a99-e9eb-4ed6-8505-0fb7fe46d767",
    "_blank"
  );
}
</script>

</body>
</html>
